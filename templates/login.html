<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP ALMACEN GENERAL - Iniciar sesión</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, #4f46e5 0%, #171a24 55%, #12141c 100%);
    padding: 1rem;
  }
  .login-card {
    width: 100%; max-width: 380px; border: none; border-radius: 1rem;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
  }
  .login-brand {
    display: flex; flex-direction: column; align-items: center; gap: .55rem;
    font-size: 1.15rem; font-weight: 800; letter-spacing: 0; color: #0f172a;
  }
  .login-brand img {
    width: 12rem; max-width: 100%; height: auto;
    background: #fff; border-radius: .5rem; padding: .35rem;
    border: 1px solid #e5e7eb;
  }
  .form-control { border-radius: .55rem; border-color: #d9dbe3; }
  .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 .2rem rgba(79,70,229,.15); }
  .btn-primary { background: #4f46e5; border-color: #4f46e5; border-radius: .55rem; font-weight: 700; }
  .btn-primary:hover, .btn-primary:focus { background: #4338ca; border-color: #4338ca; }
  .alert { border-radius: .6rem; border: none; }
</style>
</head>
<body>
<div class="card login-card p-4">
  <div class="text-center mb-4">
    <div class="login-brand">
      <img src="{{ url_for('static', filename='img/grupo-tensa-logo.png') }}" alt="Grupo Tensa">
      <span>ERP ALMACEN GENERAL</span>
    </div>
    <p class="text-muted mb-0" style="font-size:.85rem">Control de inventario</p>
  </div>
  {% if bloqueo_msg %}
  <div class="alert alert-danger py-2"><i class="bi bi-shield-lock"></i> {{ bloqueo_msg }}</div>
  {% elif error %}
  <div class="alert alert-danger py-2">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label fw-semibold">Usuario</label>
      <input type="text" name="username" class="form-control" autofocus required {{ 'disabled' if bloqueo_msg }}>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Contraseña</label>
      <input type="password" name="password" class="form-control" required {{ 'disabled' if bloqueo_msg }}>
    </div>
    <button type="submit" class="btn btn-primary w-100 fw-semibold" {{ 'disabled' if bloqueo_msg }}>
      <i class="bi bi-box-arrow-in-right"></i> Entrar
    </button>
  </form>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
