{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:520px">
  <div class="card-body p-4">
    <h1 class="h4"><i class="bi bi-shield-lock text-warning"></i> Cambio obligatorio de contraseña</h1>
    <p class="text-muted">Antes de continuar define una contraseña personal de mínimo 8 caracteres, combinando letras y números.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="mb-3"><label class="form-label">Contraseña actual</label><input type="password" name="actual" required class="form-control"></div>
      <div class="mb-3"><label class="form-label">Nueva contraseña</label><input type="password" name="nueva" minlength="8" required class="form-control"></div>
      <div class="mb-3"><label class="form-label">Confirmar nueva contraseña</label><input type="password" name="confirmar" minlength="8" required class="form-control"></div>
      <button class="btn btn-primary w-100">Guardar contraseña y continuar</button>
    </form>
  </div>
</div>
{% endblock %}
