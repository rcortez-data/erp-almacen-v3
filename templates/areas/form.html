{% extends 'base.html' %}
{% block title %}{{ 'Editar' if area_item else 'Nueva' }} área{% endblock %}
{% block content %}
<div class="topbar">
  <h1 class="page-title">
    <i class="bi bi-diagram-3 text-primary"></i>
    {{ 'Editar área' if area_item else 'Nueva área' }}
  </h1>
  <a href="{{ url_for('areas.index') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Regresar
  </a>
</div>

<div class="card" style="max-width:480px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
        <input type="text" name="nombre" class="form-control" required autocomplete="off"
               value="{{ area_item.nombre if area_item else '' }}"
               placeholder="Ej: Flexo 2, Mantenimiento">
      </div>
      {% if area_item %}
      <div class="mb-4">
        <label class="form-label fw-semibold">Estado</label>
        <select name="activo" class="form-select">
          <option value="1" {{ 'selected' if area_item.activo }}>Activa</option>
          <option value="0" {{ 'selected' if not area_item.activo }}>Inactiva</option>
        </select>
      </div>
      {% endif %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg"></i> {{ 'Guardar cambios' if area_item else 'Registrar área' }}
        </button>
        <a href="{{ url_for('areas.index') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
