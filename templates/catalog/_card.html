<div class="col-6 col-lg-3"><article class="product-card"><a href="{{ product.get_absolute_url }}"><div class="product-image">{% if product.primary_image %}<img src="{{ product.primary_image.image.url }}" alt="{{ product.primary_image.alt_text }}" loading="lazy">{% else %}<div class="shoe-placeholder">WPS</div>{% endif %}{% if product.sale_price %}<span class="sale-badge">OFERTA</span>{% endif %}</div><div class="pt-3"><small>{{ product.brand|default:product.category.name }}</small><h3>{{ product.name }}</h3><p><strong>${{ product.current_price }}</strong>{% if product.sale_price %} <del>${{ product.price }}</del>{% endif %}</p></div></a></article></div>
